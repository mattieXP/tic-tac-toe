<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="game-header">
        <h1>Tic Tac Toe</h1>
        <button id="reset-btn">Reset</button>
    </header>
    <div id="player-one">
        <img class="img-align padding" src="./graphic assets/Cross.svg">
        <h2>Player 1</h2>
            <input type="text" id="player-one-name" placeholder="Enter your name">
            <div class="img-align" id="player-one-selector"><img src="./graphic assets/Selector.svg"></div>
            <div class="anouncements" id="player-one-anouncement"></div>
    </div>
    <div id="game-board">
        <div class="anouncements" id="general-anouncement"></div>
        <div id="grid">
            <div class="game-box top-left-radius" id="a1"></div>
            <div class="game-box" id="b1"></div>
            <div class="game-box top-right-radius" id="c1"></div>
            <div class="game-box" id="a2"></div>
            <div class="game-box" id="b2"></div>
            <div class="game-box" id="c2"></div>
            <div class="game-box bottom-left-radius" id="a3"></div>
            <div class="game-box" id="b3"></div>
            <div class="game-box bottom-right-radius" id="c3"></div>
        </div>
    </div>
    <div id="player-two">
        <img class="img-align padding" src="./graphic assets/Round.svg">
        <h2>Player 2</h2>
            <input type="text" id="player-two-name" placeholder="Enter your name">
            <div class="img-align" id="player-two-selector"><img src="./graphic assets/Selector.svg"></div>
            <div class="anouncements" id="player-two-anouncement"></div>
    </div>
    <footer id="game-footer">
        <p>Made by MattieXp &copy; 2026 - following <a href="https://www.theodinproject.com/">The Odin Project</a> curriculum</p>
    </footer>
</body>
</html>
